name: attendance_ai
description: AttendanceAI - Smart Student Attendance Tracker
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.2.1
  firebase_crashlytics: ^4.0.4
  firebase_storage: ^12.1.3

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Charts
  fl_chart: ^0.68.0

  # Fonts
  google_fonts: ^6.2.1

  # Local Storage
  shared_preferences: ^2.3.1

  # Drift (local SQLite database)
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.31
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  shimmer: ^3.0.0
  uuid: ^4.4.2
  equatable: ^2.0.5

  # Icons
  cupertino_icons: ^1.0.8

  # ── File & image picking (profile photo, document import) ───────────────
  # Note: image_picker and file_picker removed — timetable is manual-entry only.

  # ── Env config (Razorpay key, etc.) ──────────────────────────────────────
  flutter_dotenv: ^5.2.1

  # ── Temp directory (SQLite path resolution) ───────────────────────────────
  path_provider: ^2.1.4

  #Razorpay
  razorpay_flutter: 1.4.0

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.28.0
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - .env




